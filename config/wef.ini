[base]
env_name = wef
async = 1

[vec]
total_agents = 512
num_buffers = 4
num_threads = 16

[policy]
# Sweep 0442 best arch. 256x3 web/eval net lives in puffer.ai.
num_layers = 4
hidden_size = 1024

[train]
# Best-run hypers (sweep_1786536792435_0442).
total_timesteps = 75_000_000
learning_rate = 0.00131931633
gamma = 0.921462655
gae_lambda = 0.94766283
replay_ratio = 2.08402061
clip_coef = 0.149713993
vf_coef = 4
vf_clip_coef = 0.729829371
max_grad_norm = 1.29817581
ent_coef = 0.000570211909
momentum = 0.914779544
minibatch_size = 4096
horizon = 32

[env]
num_agents = 4
# Set min=max for evaluation; use 40 and 300 for paper-style training.
min_arena_width = 30
max_arena_width = 400
min_arena_height = 30
max_arena_height = 400
# 0=uniform, 1=patchy, 2=random
food_distribution = 2
num_food = 64
# Patchy distribution parameters.
patch_radius = 6
patch_radius_std = 1.5
patch_density = 0.001
num_patches = 0             # patchy layout: patches per episode (0 = ceil(patch_density * area))
electric_field_radius = 15
# Wall image charges for mormyromast/ampullary near boundaries (cm).
# Sensor ranges (paper): morm food 5 / agent 10; amp food 4 / agent 8; knollen 100.
reflection_wall_range = 100
episode_length = 512

# --- Cleanup extension (docs/wef-cleanup-v0-design.md). Defaults reproduce the
# baseline env bit-for-bit; every key must be listed here so --env.key works.
cleanup = 0                 # master gate: strip/orchard/waste/regrowth/fixed-length episodes
strip_cm = 0                # waste strip width from the x=0 wall (cm)
orchard_cm = 0              # pellet band width from the far wall (cm)
spawn_band = 0              # 1: fish spawn between strip and orchard
waste_max = 0               # waste capacity (<= 64)
waste_start = 0             # active waste at reset
waste_spawn_p = 0           # per-step inflow probability (<= 1 item/step)
waste_spawn_delay = 0       # no inflow before this tick
waste_theta = 0.4           # regrowth stops when waste_active >= theta * waste_max
waste_radius_cm = 0.5       # waste object radius (sensing)
waste_contrast = 1.0        # +1 conductor (opposite sign to prey), -0.5 insulator
waste_sense_range_cm = 10   # mormyromast cutoff for waste
regrow_p_max = 0            # per-inactive-slot regrowth probability (max)
regrow_mode = 0             # 0 Cleanup: rate scales with water quality, uniform in orchard; 1 Harvest: density-dependent at the slot's position (works with cleanup = 0); 2 Commons: global logistic stock, uniform placement; 3 seasonal (GovSim-style), see season_steps
regrow_allee = 0            # Commons: no regrowth while stock <= regrow_allee * num_food (depensation / collapse threshold)
season_steps = 0            # regrow_mode 3 (seasonal, GovSim-style): steps per season; stock grows only at season ends
season_growth = 2           # regrow_mode 3: stock multiplier per season, capped at num_food; collapse (never regrows) if stock <= regrow_allee * num_food at a season end
regrow_radius_cm = 4        # Harvest: neighbourhood radius for the density count
food_start = -1             # active pellets at reset (-1 = num_food); Cleanup, and with regrowth on also Harvest/Commons (initial stock S0)
clean_priority = 0          # bite with waste and a fish in the cone: 0 fish first, 1 waste first
clean_radius_cm = 3.0       # cone radius for cleaning
clean_max_items = 1         # waste items removed per cleaning bite
clean_cooldown_steps = 5    # bite cooldown after a cleaning bite
clean_reward = 0            # private shaping per item removed (curriculum only)
clean_reward_anneal_steps = 0   # env-steps over which clean_reward anneals to 0
bitten_freeze_steps = 0     # timeout sanction: bitten fish cannot move/eat/bite (immune) this long
bitten_reward = -0.5        # WEF fine to the victim, scaled by (1 + size diff)
bite_reward = -0.0001       # WEF cost to the biter
eod_cost = 0                # per-step cost of emitting (EOD-as-public-good variant)
reward_share = 0            # r_i <- (1-w) r_i + w mean_j r_j   (0 individual, 1 common)
proximity_shaping = 0.1     # WEF food-proximity shaping coefficient
obs_extra = 0               # obs[103]: 0 constant, 1 waste fraction, 2 normalized x, 3 commons stock fraction (AH: ripe fraction), 4 own taste, 5 (n_A - n_B) / num_food, 6 own last planted type, 7 ripe fraction
size_min = 0                # fish size sampler U(size_min, size_max)
size_max = 1
desync_first_episode = 0    # stagger first-episode length across envs (training)
policy1_agents = 0          # last k fish on policy 1 (match eval only)
no_clean_agents = 0         # last k fish cannot clean (enforced free-riding)
roles = 0,0,0,0             # scripted roles per fish (eval only): 1 cleaner, 2 eater, 3 shift, 4 random, 5 sustainable eater, 6 dense-first greedy eater, 7 stock-threshold eater; allelo: 8 planter-own, 9 planter-majority, 10 free-rider (2 is aliased to 10), 11 zapper-planter, 12 opportunistic planter
bot_shift_steps = 256       # role 3: alternate cleaner/eater every this many steps
bot_oracle = 0              # scripted roles: 0 target only items within sensing range, 1 env positions
bot_theta = 0.5             # role 7: eat only while stock > bot_theta * num_food
bot_camp = 0                # scripted eaters: > 0 = circle the last eating spot at this radius (cm) when no pellet is in range, instead of lane patrol
sustain_frac = 0.5          # metrics only: eating at stock <= sustain_frac * num_food marks a fish as a defector (bites_on_defectors, bites_at_risk)
regrow_in_patches = 0       # commons (regrow_mode 2/3): regrown pellets land inside this episode's food patches (needs food_distribution 1)
render_field = 1            # renderer only: 1 field arrows around each fish (upstream), 0 off (F toggles)
render_field_alpha = 1      # renderer only: field-arrow opacity multiplier (1 = upstream)

# --- Allelopathic Harvest (docs/wef-allelopathic-harvest-v0-design.md). Defaults reproduce
# the baseline env bit-for-bit. The AH presets run on the 8-fish build
# (NVCC_EXTRA="-DMAX_AGENTS=8 -DWEF_AH_DASH" ./build.sh wef build/puffer_wef8); see scripts/ah_strict.args.
allelo = 0                  # master gate: typed bushes (A/B), ripening, planting bites, taste by size, fixed-length episodes, V3 traces, perf = mono_frac
ripen_lin = 0               # ripening F(x) = ripen_lin x + ripen_cubic x^ripen_pow per unripe bush per step, x = n_type / num_food (AH-strict 8.9e-3; AH-conv 1.7e-3)
ripen_cubic = 0             # convex coefficient (AH-conv 7.2e-3)
ripen_pow = 3               # exponent of the convex term
ripen_min_steps = 0         # minimum unripe time after an eat / planting (Melting Pot 10)
start_frac_a = 0.5          # initial fraction of type-A bushes (1 or 0 = initial monoculture)
start_ripe_frac = 0         # bushes ripe at reset (curriculum only)
food_contrast_a = -0.5      # type A induced-dipole contrast (today's pellet)
food_contrast_b = 0.5       # type B contrast (+1.0 = the waste signature, salience ablation)
food_radius_unripe_cm = 0.25    # induced-dipole radius of an unripe bush (preset 0.12)
food_radius_ripe_cm = 0.25      # of a ripe bush (preset 0.30)
unripe_intrinsic = 1        # multiplier on the intrinsic (ampullary) moment of unripe bushes (preset 0)
ripe_intrinsic = 1          # of ripe bushes (preset 3)
taste_match = 1             # eat reward for the fish's own type
taste_other = 1             # eat reward for the other type (preset 0.5; the reward clamp caps the ratio at 1 / taste_other)
taste_other_a = -1          # per-taste-group other-type reward (-1 = taste_other)
taste_other_b = -1
taste_split = 0.5           # taste_n_a = -1: size >= taste_split -> A, else B
taste_n_a = -1              # -1 free size draw; n: fish 0..n-1 are A (band A), the rest B (band B); -2 per-episode Bernoulli(1/2) split in the bands
size_a_min = 0.5            # size band of taste A (preset 0.58-0.62)
size_a_max = 0.5
size_b_min = 0.5            # size band of taste B (preset 0.38-0.42)
size_b_max = 0.5
size_speed_exp = 1          # speed exponent in AH mode (0 = taste without a speed edge)
plant_mode = 1              # 0 planting off, 1 taste-relative bins (upper = own type), 2 own type only
plant_split = 0.6745        # bin boundary on the raw bite value (median of the half-normal)
plant_bin_order = 0         # 0 upper bin = own type; 1 lower bin = own type (control)
plant_priority = 0          # bite with a fish and a bush in the cone: 0 fish first (zap), 1 bush first, 2 nearest first
plant_radius_cm = 3.0       # planting cone radius
plant_steps = 0             # hold after a conversion: no motion, no eating (AH-strict 32, AH-conv 8)
plant_cooldown_steps = 5    # bite cooldown after a planting bite (max with plant_steps on a conversion)
plant_reward = 0            # private shaping per conversion, after mixing (curriculum only)
plant_reward_anneal_steps = 0   # env-steps over which plant_reward anneals to 0
zap_cooldown_steps = 5      # bite cooldown after a fish bite (preset 25)
zap_steps = 0               # hold on the attacker after a zap (pricing lever)
conv_theta = 0.9            # metrics: monoculture fraction that counts as a convention (time_to_convention)
bot_plant_theta = 1         # planter bots: plant only while n_type[target] / num_food < theta
bot_plant_max = 0           # planter bots: conversions per episode (0 = unlimited)
bot_plant_frac = 1          # planter bots: probability of going planting when no ripe bush is within the 5 cm sense range
